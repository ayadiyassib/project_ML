{# Column <select>: ``name``, ``label``, ``options`` (list of column names), ``selected``, optional ``optional``. #}
<div>
    <label class="block text-[11px] font-medium text-slate-300 mb-1.5">{{ label }}
        <select name="{{ name }}"
                class="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-normal text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500">
            {% if optional %}<option value="" {% if not selected %}selected{% endif %}>Aucune</option>{% endif %}
            {% for option in options %}
            <option value="{{ option }}" {% if option == selected %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
        </select>
    </label>
</div>
