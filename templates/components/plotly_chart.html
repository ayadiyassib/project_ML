{# Reusable Plotly chart card. Expects ``chart`` (apps.eda.theme.Chart). Rendered client-side by static/js/ml_charts.js #}
<figure class="bg-[#1b1918] border border-slate-800 rounded-2xl overflow-hidden min-w-0 {% if chart.wide %}lg:col-span-2{% endif %} {{ extra_classes }}">
    <figcaption class="px-5 pt-4 pb-2 flex items-start justify-between gap-3">
        <div class="min-w-0">
            <h3 class="font-display text-[15px] font-semibold text-paper tracking-normal">{{ chart.title }}</h3>
            {% if chart.subtitle %}<p class="text-[11px] text-slate-400 mt-0.5">{{ chart.subtitle }}</p>{% endif %}
        </div>
        {% if chart.note %}
        <span class="shrink-0 text-[10px] font-mono text-slate-500 border border-slate-800 rounded-md px-2 py-0.5" title="{{ chart.note }}">échantillon</span>
        {% endif %}
    </figcaption>
    <div class="px-2 pb-3">
        <div class="ml-chart w-full" style="height: {{ chart.height }}px" data-plotly="{{ chart.id }}" role="img" aria-label="{{ chart.title }}"></div>
    </div>
    {% if chart.note %}<p class="px-5 pb-3 -mt-1 text-[10px] text-slate-500">{{ chart.note }}</p>{% endif %}
    <script type="application/json" id="{{ chart.id }}">{{ chart.payload }}</script>
</figure>
