<!-- Flash Notifications & Toasts (Alpine.js) -->
<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
    {% if messages %}
        {% for message in messages %}
        <div x-data="{ show: true }" 
             x-show="show" 
             x-init="setTimeout(() => show = false, 4000)"
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="opacity-0 translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-y-2"
             class="pointer-events-auto flex items-center space-x-3 max-w-md p-4 rounded-xl shadow-xl border backdrop-blur-md 
                    {% if message.tags == 'error' %}bg-rose-950/90 text-rose-200 border-rose-800/80
                    {% elif message.tags == 'warning' %}bg-amber-950/90 text-amber-200 border-amber-800/80
                    {% elif message.tags == 'success' %}bg-emerald-950/90 text-emerald-200 border-emerald-800/80
                    {% else %}bg-slate-900/90 text-slate-200 border-slate-700/80{% endif %}">
            
            <div class="shrink-0">
                {% if message.tags == 'error' %}
                <svg class="w-5 h-5 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                {% elif message.tags == 'success' %}
                <svg class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                {% else %}
                <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                {% endif %}
            </div>

            <div class="flex-1 text-sm font-medium">
                {{ message }}
            </div>

            <button @click="show = false" class="text-slate-400 hover:text-white shrink-0 ml-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        {% endfor %}
    {% endif %}
</div>
