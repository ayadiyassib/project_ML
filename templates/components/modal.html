<!-- Reusable Alpine.js Modal Component -->
<div x-data="{ open: false }" 
     @open-modal.window="if ($event.detail.id === '{{ modal_id }}') open = true"
     @close-modal.window="if ($event.detail.id === '{{ modal_id }}') open = false"
     @keydown.escape.window="open = false"
     x-cloak>
    
    <div x-show="open" 
         style="display: none;"
         class="fixed inset-0 z-50 overflow-y-auto" 
         aria-labelledby="modal-title" 
         role="dialog" 
         aria-modal="true">
        
        <!-- Backdrop -->
        <div x-show="open" 
             style="display: none;"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity" 
             @click="open = false"></div>

        <!-- Modal Dialog Box -->
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div x-show="open" 
                 x-transition:enter="ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                 x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                 x-transition:leave="ease-in duration-200"
                 x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                 x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                 @click.stop
                 class="relative transform overflow-hidden rounded-2xl bg-[#161b22] border border-slate-800 text-left shadow-2xl transition-all sm:my-8 sm:w-full {{ max_width|default:'sm:max-w-xl' }}">
                
                <!-- Modal Header -->
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800/80">
                    <h3 class="text-base font-semibold text-white tracking-tight" id="modal-title">
                        {{ modal_title }}
                    </h3>
                    <button @click="open = false" class="text-slate-400 hover:text-white rounded-lg p-1 hover:bg-slate-800/60 transition-colors">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="px-6 py-5 text-sm text-slate-300">
                    {{ modal_body }}
                </div>

                <!-- Modal Footer -->
                {% if modal_footer %}
                <div class="px-6 py-3.5 bg-slate-900/60 border-t border-slate-800/80 flex items-center justify-end space-x-3">
                    {{ modal_footer }}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
