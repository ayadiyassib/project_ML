<!-- Reusable Card Component -->
<div class="bg-[#1b1918] border border-slate-800 rounded-2xl shadow-sm hover:border-slate-700/80 transition-all p-6 {{ extra_classes }}">
    {% if card_title %}
    <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800/80">
        <div>
            <h3 class="text-base font-semibold text-white tracking-tight">{{ card_title }}</h3>
            {% if card_subtitle %}
            <p class="text-xs text-slate-400 mt-0.5">{{ card_subtitle }}</p>
            {% endif %}
        </div>
        {% if card_badge %}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-800/60 text-slate-300 border border-slate-700/70">
            {{ card_badge }}
        </span>
        {% endif %}
    </div>
    {% endif %}
    <div>
        {{ card_content }}
    </div>
</div>
